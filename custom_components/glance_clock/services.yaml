read_current_settings:
  name: "Read Current Settings"
  description: "Read current settings from the Glance Clock device"

refresh_entities:
  name: "Refresh Entities"
  description: "Refresh all entity states for the Glance Clock"

send_forecast:
  name: "Send Weather Forecast"
  # Writes to scene slot 1. Remove it again with clear_leds and slot 1 -- a
  # scene stays in its slot and replays until something clears it.
  description: "Send 24-hour weather forecast data to the Glance Clock with color gradient support"
  fields:
    weather_entity:
      name: "Weather Entity"
      description: "The weather entity to get hourly forecast data from"
      required: true
      selector:
        entity:
          domain: weather
    max_color:
      name: "Maximum Temperature Color"
      description: "Color for maximum temperature display"
      default: "#FF0000"
      selector:
        color_rgb:
    min_color:
      name: "Minimum Temperature Color"
      description: "Color for minimum temperature display"
      default: "#0000FF"
      selector:
        color_rgb:
    min_value:
      name: "Minimum Value Range"
      description: "Temperature value for the minimum color (0-40°C range). If not set, uses actual forecast minimum."
      selector:
        number:
          min: -50
          max: 50
          step: 1
    max_value:
      name: "Maximum Value Range"
      description: "Temperature value for the maximum color (0-40°C range). If not set, uses actual forecast maximum."
      selector:
        number:
          min: -50
          max: 50
          step: 1
    template:
      name: "Display Template"
      description: "Optional display template data (advanced users). If not provided, uses default thermometer icon + value + °C"
      selector:
        text:

set_dnd_schedule:
  name: Set DND schedule
  description: >-
    Set the recurring Do Not Disturb window stored on the clock. This is the
    schedule the clock applies itself, separate from the permanent DND flag.
  fields:
    from_hour:
      name: From hour
      description: Hour the quiet period starts, 0-23.
      example: 21
      selector:
        number:
          min: 0
          max: 23
          mode: box
    till_hour:
      name: Till hour
      description: Hour the quiet period ends, 0-23. May be earlier than the start to span midnight.
      example: 7
      selector:
        number:
          min: 0
          max: 23
          mode: box
    recurring:
      name: Recurring
      description: Whether the window repeats every day.
      default: true
      selector:
        boolean:

read_dnd_schedule:
  name: Read DND schedule
  description: >-
    Read the Do Not Disturb window currently stored on the clock and write it
    to the Home Assistant log.

set_leds:
  name: Set LEDs
  description: >-
    Light areas of the clock's four LED rings. Each ring has 48 pixels; pixel 0 is at
    twelve o'clock and numbering runs clockwise. Ring 0 is the outermost.
  fields:
    segments:
      name: Segments
      description: >-
        List of areas to light. Each needs 'start' (0-47) and 'color' (a colour name),
        and may set 'length' (pixels, default 1), 'ring' (0-3, default 0) and
        'rings_tall' (default 1).
      required: true
      example: |-
        - start: 0
          length: 12
          ring: 0
          color: red
        - start: 24
          length: 6
          ring: 1
          color: sky_blue
      selector:
        object:
    mode:
      name: Display mode
      description: >-
        How the scene shares the display. 'watchface' shows it together with the digital
        time, 'exclusive' hides the digital clockface, 'ring_and_text' alternates with it.
      default: watchface
      selector:
        select:
          mode: dropdown
          options:
            - watchface
            - exclusive
            - ring_and_text
    slot:
      name: Scene slot
      description: Which scene slot to store this in. Reusing a slot replaces its contents.
      default: 0
      selector:
        number:
          min: 0
          max: 7
          mode: box
    life_time:
      name: Lifetime
      description: >-
        Frames at 50 FPS before the scene stops animating. A fill stays on screen
        afterwards, so this is not how long it is visible.
      default: 50
      selector:
        number:
          min: 1
          max: 3000
          mode: box

clear_leds:
  name: Clear LEDs
  description: Remove a scene previously sent with Set LEDs.
  fields:
    slot:
      name: Scene slot
      description: The slot to clear.
      default: 0
      selector:
        number:
          min: 0
          max: 7
          mode: box

set_animation:
  name: Set animation
  description: >-
    Run one of the animations built into the clock's firmware on the LED rings. They
    are single-colour patterns tinted by the colour you pick.
  fields:
    animation:
      name: Animation
      description: >-
        'sweep' fills the area from its start pixel, pauses and repeats; its speed sign
        sets the direction. The rest are firmware effects.
      default: fire
      selector:
        select:
          mode: dropdown
          options:
            - sweep
            - fire
            - wheel
            - flower
            - flower2
            - fan
            - sun
            - thunderstorm
            - cloud
    color:
      name: Colour
      description: Colour name from the clock's palette. Black renders nothing.
      default: white
      selector:
        text:
    speed:
      name: Speed
      description: >-
        0-10 for the firmware animations. 'sweep' takes -10 to 10, where a negative
        value runs anticlockwise.
      default: 3
      selector:
        number:
          min: -10
          max: 10
          mode: slider
    start:
      name: Start pixel
      description: 0-47, clockwise from twelve o'clock.
      default: 0
      selector:
        number:
          min: 0
          max: 47
          mode: box
    length:
      name: Length
      description: >-
        Pixels to cover. The firmware animations only render multiples of 8 and round
        anything else down.
      default: 48
      selector:
        number:
          min: 1
          max: 48
          mode: box
    ring:
      name: Ring
      description: 0-3, counted from the outer edge.
      default: 0
      selector:
        number:
          min: 0
          max: 3
          mode: box
    rings_tall:
      name: Rings tall
      description: How many rings the animation covers.
      default: 4
      selector:
        number:
          min: 1
          max: 4
          mode: box
    mode:
      name: Display mode
      default: watchface
      selector:
        select:
          mode: dropdown
          options:
            - watchface
            - exclusive
            - ring_and_text
    slot:
      name: Scene slot
      default: 0
      selector:
        number:
          min: 0
          max: 7
          mode: box
    life_time:
      name: Lifetime
      description: Frames at 50 FPS that the animation runs for.
      default: 2500
      selector:
        number:
          min: 1
          max: 30000
          mode: box

set_scene:
  name: Set scene
  description: >-
    Send a timed sequence of fills that the clock plays itself at 50 frames per second.
    This is how to animate: one call uploads the whole timeline, and the clock runs it
    at its own frame rate. Sending fills one at a time cannot animate -- every call is a
    Bluetooth round trip, so the timing is whatever the radio happened to do.
  fields:
    steps:
      name: Steps
      description: >-
        List of steps. Every step takes 'frames' or 'seconds' for how long it runs, and
        optionally 'at' to place it on the timeline; without 'at' a step follows on from
        the previous one. A step's 'type' is one of: 'fill' (default, takes 'segments'),
        'effect' (pulse, wave or light_flash, layered onto areas already drawn in this
        scene), 'text', 'sound', or 'weather' (snow, rain or fog as a particle effect).
        Anything drawn stays on screen after its step ends, so paint black over what
        should disappear.
      required: true
      example: |-
        - seconds: 0.5
          segments:
            - { start: 0, length: 6, ring: 0, rings_tall: 4, color: red }
        - seconds: 0.5
          segments:
            - { start: 0, length: 6, ring: 0, rings_tall: 4, color: black }
            - { start: 6, length: 6, ring: 0, rings_tall: 4, color: red }
      selector:
        object:
    default_frames:
      name: Default frames
      description: How long a step runs when it gives neither frames nor seconds.
      default: 25
      selector:
        number:
          min: 1
          max: 3000
          mode: box
    mode:
      name: Display mode
      default: watchface
      selector:
        select:
          mode: dropdown
          options:
            - watchface
            - exclusive
            - ring_and_text
    slot:
      name: Scene slot
      default: 0
      selector:
        number:
          min: 0
          max: 7
          mode: box

send_command:
  name: Send command
  description: >-
    Send a raw command frame to the clock. This is the escape hatch for parts of the
    firmware the integration does not model yet, and for driving the clock from
    Node-RED. A frame is a command byte, up to three modifier bytes, and an optional
    payload; missing modifiers are padded with zeroes. Useful commands include 30
    (stop scene playback), 31 (start scene playback), 35 (update and refresh) and 61
    and 60 (start and stop the brightness scene). Commands 42 and 50 are blocked
    because they unpair the clock or wipe user data, and neither can be undone
    without the manufacturer's servers.
  fields:
    command:
      name: Command
      description: The command byte.
      required: true
      example: 31
      selector:
        number:
          min: 0
          max: 255
          mode: box
    modifiers:
      name: Modifiers
      description: Up to three modifier bytes. Omitted ones are sent as zero.
      required: false
      example: "[0, 0, 0]"
      selector:
        object:
    payload:
      name: Payload
      description: Optional payload, as a hex string such as "20 01" or a list of bytes.
      required: false
      example: "2001"
      selector:
        text:

read_characteristic:
  name: Read characteristic
  description: >-
    Read one of the clock's GATT characteristics and return its bytes. Returns a
    response rather than logging, so the result comes back to the caller.
  fields:
    characteristic:
      name: Characteristic
      description: >-
        One of settings, scene_data, scene_state, or a full UUID. Use "list" to
        enumerate every service and characteristic the clock exposes, with the
        properties each one supports.
      required: false
      default: settings
      example: scene_state
      selector:
        text:
