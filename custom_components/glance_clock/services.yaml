send_timer:
  name: "Send Timer"
  description: "Send a timer scene to the Glance Clock. The timer will run on the device."
  fields:
    countdown:
      name: "Countdown (seconds)"
      description: "Time before timer starts."
      required: false
      selector:
        number:
          min: 0
          max: 86400
          step: 1
    final_text:
      name: "Final Text (optional)"
      description: "Text to display when the timer finishes. Supports [icon:CODE] syntax."
      required: false
      selector:
        text:
    intervals:
      name: "Intervals (optional)"
      description: |
        List of timer intervals. Each interval can have:
          - text: string (supports [icon:CODE])
          - duration: seconds (int)
          - countdown: seconds (int, optional)
        Leave empty for a simple timer.
      required: true
      selector:
        object:
          label_field: text
          description_field: duration
          multiple: true
          fields:
            text:
              label: "Text"
              selector:
                text:
            duration:
              label: "Duration (seconds)"
              selector:
                number:
                  min: 1
                  max: 86400
                  step: 1
            countdown:
              label: "Countdown (seconds, optional)"
              selector:
                number:
                  min: 0
                  max: 86400
                  step: 1

update_display_settings:
  name: "Update Display Settings"
  description: "Update display settings on the Glance Clock"
  fields:
    nightModeEnabled:
      name: "Night Mode Enabled"
      description: "Enable automatic night mode"
      default: true
      selector:
        boolean:
    pointsAlwaysEnabled:
      name: "Points Always Enabled"
      description: "Always show time separator points"
      default: false
      selector:
        boolean:
    displayBrightness:
      name: "Display Brightness"
      description: "Screen brightness level (0-255, 0=auto). Note: Use the light entity for easier brightness control"
      default: 128
      selector:
        number:
          min: 0
          max: 255
          step: 1
    timeModeEnable:
      name: "Time Mode Enable"
      description: "Enable time display on the clock"
      default: true
      selector:
        boolean:
    timeFormat12:
      name: "12-Hour Format"
      description: "Use 12-hour format instead of 24-hour"
      default: false
      selector:
        boolean:
    dateFormat:
      name: "Date Format"
      description: "Date display format (0=Disabled, 1=24 Jan, 2=24 Tue, 3=Jan 24, 4=Tue 24)"
      default: 0
      selector:
        number:
          min: 0
          max: 4
          step: 1

send_notice:
  name: "Send Notice"
  description: "Send a notification notice to the Glance Clock"
  fields:
    text:
      name: "Text"
      description: |
        Message text to display. To insert an icon, use [icon:CODE] in your message (e.g., "Wake up! [icon:123]").

        See the full list of available icons: https://github.com/PorlyBe/glance_clock_ha/blob/master/ICONS.md
      required: true
      selector:
        text:
    animation:
      name: "Animation"
      description: "Visual animation effect"
      default: "pulse"
      selector:
        select:
          options:
            - label: "None"
              value: "none"
            - label: "Pulse"
              value: "pulse"
            - label: "Wave"
              value: "wave"
            - label: "Fire"
              value: "fire"
            - label: "Wheel"
              value: "wheel"
            - label: "Flower"
              value: "flower"
            - label: "Sun"
              value: "sun"
            - label: "Thunderstorm"
              value: "thunderstorm"
            - label: "Cloud"
              value: "cloud"
    sound:
      name: "Sound"
      description: "Notification sound"
      default: "none"
      selector:
        select:
          options:
            - label: "None"
              value: "none"
            - label: "Waves"
              value: "waves"
            - label: "Rise"
              value: "rise"
            - label: "Bells"
              value: "bells"
            - label: "Radar"
              value: "radar"
            - label: "Hello"
              value: "hello"
            - label: "Complete"
              value: "complete"
    color:
      name: "Color"
      description: "Display color"
      default: "white"
      selector:
        select:
          options:
            - label: "White"
              value: "white"
            - label: "Red"
              value: "red"
            - label: "Blue"
              value: "blue"
            - label: "Green (Lime)"
              value: "lime"
            - label: "Orange"
              value: "dark_orange"
            - label: "Purple"
              value: "blue_violet"
            - label: "Yellow"
              value: "lawn_green"
    priority:
      name: "Priority"
      description: "Notification priority level"
      default: "medium"
      selector:
        select:
          options:
            - label: "Low"
              value: "low"
            - label: "Medium"
              value: "medium"
            - label: "High"
              value: "high"
            - label: "Critical"
              value: "critical"
    text_modifier:
      name: "Text Effect"
      description: "Text display effect"
      default: "none"
      selector:
        select:
          options:
            - label: "None"
              value: "none"
            - label: "Repeat"
              value: "repeat"
            - label: "Rapid"
              value: "rapid"
            - label: "Delay"
              value: "delay"

read_current_settings:
  name: "Read Current Settings"
  description: "Read current settings from the Glance Clock device"

refresh_entities:
  name: "Refresh Entities"
  description: "Refresh all entity states for the Glance Clock"

send_forecast:
  name: "Send Weather Forecast"
  # Writes to scene slot 1. Remove it again with clear_leds and slot 1 -- a
  # scene stays in its slot and replays until something clears it.
  description: "Send 24-hour weather forecast data to the Glance Clock with color gradient support"
  fields:
    weather_entity:
      name: "Weather Entity"
      description: "The weather entity to get hourly forecast data from"
      required: true
      selector:
        entity:
          domain: weather
    max_color:
      name: "Maximum Temperature Color"
      description: "Color for maximum temperature display"
      default: "#FF0000"
      selector:
        color_rgb:
    min_color:
      name: "Minimum Temperature Color"
      description: "Color for minimum temperature display"
      default: "#0000FF"
      selector:
        color_rgb:
    min_value:
      name: "Minimum Value Range"
      description: "Temperature value for the minimum color (0-40°C range). If not set, uses actual forecast minimum."
      selector:
        number:
          min: -50
          max: 50
          step: 1
    max_value:
      name: "Maximum Value Range"
      description: "Temperature value for the maximum color (0-40°C range). If not set, uses actual forecast maximum."
      selector:
        number:
          min: -50
          max: 50
          step: 1
    template:
      name: "Display Template"
      description: "Optional display template data (advanced users). If not provided, uses default thermometer icon + value + °C"
      selector:
        text:

set_dnd_schedule:
  name: Set DND schedule
  description: >-
    Set the recurring Do Not Disturb window stored on the clock. This is the
    schedule the clock applies itself, separate from the permanent DND flag.
  fields:
    from_hour:
      name: From hour
      description: Hour the quiet period starts, 0-23.
      example: 21
      selector:
        number:
          min: 0
          max: 23
          mode: box
    till_hour:
      name: Till hour
      description: Hour the quiet period ends, 0-23. May be earlier than the start to span midnight.
      example: 7
      selector:
        number:
          min: 0
          max: 23
          mode: box
    recurring:
      name: Recurring
      description: Whether the window repeats every day.
      default: true
      selector:
        boolean:

read_dnd_schedule:
  name: Read DND schedule
  description: >-
    Read the Do Not Disturb window currently stored on the clock and write it
    to the Home Assistant log.

set_leds:
  name: Set LEDs
  description: >-
    Light areas of the clock's four LED rings. Each ring has 48 pixels; pixel 0 is at
    twelve o'clock and numbering runs clockwise. Ring 0 is the outermost.
  fields:
    segments:
      name: Segments
      description: >-
        List of areas to light. Each needs 'start' (0-47) and 'color' (a colour name),
        and may set 'length' (pixels, default 1), 'ring' (0-3, default 0) and
        'rings_tall' (default 1).
      required: true
      example: |-
        - start: 0
          length: 12
          ring: 0
          color: red
        - start: 24
          length: 6
          ring: 1
          color: sky_blue
      selector:
        object:
    mode:
      name: Display mode
      description: >-
        How the scene shares the display. 'watchface' shows it together with the digital
        time, 'exclusive' hides the digital clockface, 'ring_and_text' alternates with it.
      default: watchface
      selector:
        select:
          mode: dropdown
          options:
            - watchface
            - exclusive
            - ring_and_text
    slot:
      name: Scene slot
      description: Which scene slot to store this in. Reusing a slot replaces its contents.
      default: 0
      selector:
        number:
          min: 0
          max: 7
          mode: box
    life_time:
      name: Lifetime
      description: >-
        Frames at 50 FPS before the scene stops animating. A fill stays on screen
        afterwards, so this is not how long it is visible.
      default: 50
      selector:
        number:
          min: 1
          max: 3000
          mode: box

clear_leds:
  name: Clear LEDs
  description: Remove a scene previously sent with Set LEDs.
  fields:
    slot:
      name: Scene slot
      description: The slot to clear.
      default: 0
      selector:
        number:
          min: 0
          max: 7
          mode: box

set_animation:
  name: Set animation
  description: >-
    Run one of the animations built into the clock's firmware on the LED rings. They
    are single-colour patterns tinted by the colour you pick.
  fields:
    animation:
      name: Animation
      description: >-
        'sweep' fills the area from its start pixel, pauses and repeats; its speed sign
        sets the direction. The rest are firmware effects.
      default: fire
      selector:
        select:
          mode: dropdown
          options:
            - sweep
            - fire
            - wheel
            - flower
            - flower2
            - fan
            - sun
            - thunderstorm
            - cloud
    color:
      name: Colour
      description: Colour name from the clock's palette. Black renders nothing.
      default: white
      selector:
        text:
    speed:
      name: Speed
      description: >-
        0-10 for the firmware animations. 'sweep' takes -10 to 10, where a negative
        value runs anticlockwise.
      default: 3
      selector:
        number:
          min: -10
          max: 10
          mode: slider
    start:
      name: Start pixel
      description: 0-47, clockwise from twelve o'clock.
      default: 0
      selector:
        number:
          min: 0
          max: 47
          mode: box
    length:
      name: Length
      description: >-
        Pixels to cover. The firmware animations only render multiples of 8 and round
        anything else down.
      default: 48
      selector:
        number:
          min: 1
          max: 48
          mode: box
    ring:
      name: Ring
      description: 0-3, counted from the outer edge.
      default: 0
      selector:
        number:
          min: 0
          max: 3
          mode: box
    rings_tall:
      name: Rings tall
      description: How many rings the animation covers.
      default: 4
      selector:
        number:
          min: 1
          max: 4
          mode: box
    mode:
      name: Display mode
      default: watchface
      selector:
        select:
          mode: dropdown
          options:
            - watchface
            - exclusive
            - ring_and_text
    slot:
      name: Scene slot
      default: 0
      selector:
        number:
          min: 0
          max: 7
          mode: box
    life_time:
      name: Lifetime
      description: Frames at 50 FPS that the animation runs for.
      default: 2500
      selector:
        number:
          min: 1
          max: 30000
          mode: box

set_scene:
  name: Set scene
  description: >-
    Send a timed sequence of fills that the clock plays itself at 50 frames per second.
    This is how to animate: one call uploads the whole timeline. Sending fills one at a
    time cannot animate, because a scene change only takes effect on the clock's roughly
    15 second scene cycle.
  fields:
    steps:
      name: Steps
      description: >-
        List of steps. Each takes 'segments' (same shape as Set LEDs) plus 'frames' or
        'seconds' for how long it runs, and optionally 'at' to place it on the timeline.
        Without 'at' a step follows on from the previous one. Anything drawn stays on
        screen after its step ends, so paint black over what should disappear.
      required: true
      example: |-
        - seconds: 0.5
          segments:
            - { start: 0, length: 6, ring: 0, rings_tall: 4, color: red }
        - seconds: 0.5
          segments:
            - { start: 0, length: 6, ring: 0, rings_tall: 4, color: black }
            - { start: 6, length: 6, ring: 0, rings_tall: 4, color: red }
      selector:
        object:
    default_frames:
      name: Default frames
      description: How long a step runs when it gives neither frames nor seconds.
      default: 25
      selector:
        number:
          min: 1
          max: 3000
          mode: box
    mode:
      name: Display mode
      default: watchface
      selector:
        select:
          mode: dropdown
          options:
            - watchface
            - exclusive
            - ring_and_text
    slot:
      name: Scene slot
      default: 0
      selector:
        number:
          min: 0
          max: 7
          mode: box
